<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 40px;
            color: #222;
        }

        form {
            width: 360px;
        }

        p {
            margin: 10px 0;
        }

        input[type=text], input[type=password] {
            width: 200px;
            padding: 4px 6px;
        }

        input[type=submit] {
            padding: 6px 18px;
            cursor: pointer;
        }

        #msg {
            color: #c00;
        }
    </style>
</head>
<body>
<h3>用户登录</h3>
<p id="msg"></p>
<form action="login" method="post">
    <p>用户名：<input type="text" name="username" value="李理想"></p>
    <p>密&nbsp;&nbsp;码：<input type="password" name="password" value="092224110"></p>
    <p><label><input type="checkbox" name="rememberMe" value="true"> 记住我（7 天自动登录）</label></p>
    <p><input type="submit" value="登录"></p>
</form>
<script>
    // 登录失败时由 LoginServlet 重定向回本页并带上 error=1，这里显示提示
    if (new URLSearchParams(location.search).get('error') === '1') {
        document.getElementById('msg').textContent = '用户名或密码错误，请重新输入！';
    }
</script>
</body>
</html>
